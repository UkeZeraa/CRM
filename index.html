<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ascend CRM — Atendimento</title>
  <link rel="icon" href="assets/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/brand.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="logo">
        <img src="assets/logo.svg" alt="" />
        <div><strong>ASCEND</strong><span>CRM de Atendimento</span></div>
      </div>
      <nav class="nav">
        <a href="#/dashboard" data-route="dashboard"><i>◧</i>Visão geral</a>
        <a href="#/atendimentos" data-route="atendimentos"><i>✉</i>Atendimentos <b class="badge" id="badge-open"></b></a>
        <a href="#/contatos" data-route="contatos"><i>☺</i>Contatos</a>
        <a href="#/funil" data-route="funil"><i>⇗</i>Funil de vendas</a>
        <a href="#/configuracoes" data-route="configuracoes"><i>⚙</i>Configurações</a>
      </nav>
      <div class="me" id="me"></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Menu">☰</button>
        <h1 id="page-title">Visão geral</h1>
        <div class="topbar-actions">
          <input class="search" id="global-search" placeholder="Buscar contato ou atendimento…" />
          <button class="btn btn-primary" id="new-ticket-btn">+ Novo atendimento</button>
        </div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head"><h3 id="modal-title"></h3><button class="icon-btn" data-close>✕</button></div>
      <div id="modal-body"></div>
    </div>
  </div>
  <div class="toast" id="toast" hidden></div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
